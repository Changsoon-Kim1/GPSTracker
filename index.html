        // ===== 예상 소모 칼로리: ACSM 보행 대사식 기반 =====
        // ACSM: VO2(mL/kg/min) = 0.1*S + 1.8*S*G + 3.5  (S: 속도 m/min, G: 경사 소수)
        //  -> 수평 이동 1m당 0.1 mL O2/kg, 고도 상승 1m당 1.8 mL O2/kg, 안정시 3.5 mL/kg/min(=1 MET)
        // 산소 1L = 약 5kcal. 하산은 평지 걷기와 같은 비용으로 계산(제동·균형 부하 반영, 에너지 절감 미인정).
        // 상승/하강은 GPS 고도 잡음을 걸러낸 값(앞뒤 15m 평균 + ±3m 이내 변화 무시)을 쓴다.
        const BODY_KG_KEY = 'gpxTracker_bodyKg';
        const KCAL_PER_ML_O2 = 0.005;
        const ML_O2_PER_KG_PER_M_HORIZ = 0.1;
        const ML_O2_PER_KG_PER_M_ASCENT = 1.8;
        const REST_KCAL_PER_KG_HOUR = 3.5 * 60 * KCAL_PER_ML_O2; // 1 MET = 1.05 kcal/kg/h
        let energyCache = null;

        function computeEnergyProfile(pts, hours) {
            const distM = pts && pts.length ? pts[pts.length - 1].cumDist : 0;
            const ad = calcAscentDescentFromPoints(pts);
            return { distM, ascentM: ad.asc, descentM: ad.desc, hours: hours || 0 };
        }

        function updateEnergyDisplay() {
            if (!energyCache) return;
            const bodyKg = Math.max(0, parseFloat(document.getElementById('energy-body-kg').value) || 0);
            const packKg = Math.max(0, parseFloat(document.getElementById('energy-pack-kg').value) || 0);
            const terrain = parseFloat(document.getElementById('energy-terrain').value) || 1;
            const mass = bodyKg + packKg;
            if (bodyKg > 0) { try { localStorage.setItem(BODY_KG_KEY, String(bodyKg)); } catch (e) {} }

            const p = energyCache;
            const horizKcal = ML_O2_PER_KG_PER_M_HORIZ * p.distM * mass * KCAL_PER_ML_O2 * terrain;
            const upKcal = ML_O2_PER_KG_PER_M_ASCENT * p.ascentM * mass * KCAL_PER_ML_O2 * terrain;
            const activeKcal = horizKcal + upKcal;
            const totalKcal = p.hours > 0 ? activeKcal + REST_KCAL_PER_KG_HOUR * bodyKg * p.hours : null;
            const fmt = x => Math.round(x).toLocaleString();

            const ok = bodyKg > 0;
            document.getElementById('energy-active').textContent = ok ? `${fmt(activeKcal)} kcal` : '체중 입력';
            document.getElementById('energy-total').textContent = ok ? (totalKcal === null ? '시간 정보 없음' : `${fmt(totalKcal)} kcal`) : '체중 입력';
            document.getElementById('energy-horiz').innerHTML = ok ? `${(p.distM / 1000).toFixed(1)}km<br>${fmt(horizKcal)}kcal` : '-';
            document.getElementById('energy-up').innerHTML = ok ? `+${fmt(p.ascentM)}m<br>${fmt(upKcal)}kcal` : '-';
            document.getElementById('energy-down-note').textContent = `하강 -${fmt(p.descentM)}m는 평지와 같은 비용으로 계산`;
        }

        function formatLogTime(ts) {
            return new Date(ts).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
        }

        // 트랙 시작~종료 일시 표시용 (기기의 현재 시간대 기준)
        function formatTrackPeriod(pts) {
            let t0 = null, t1 = null;
            for (let i = 0; i < pts.length; i++) { if (pts[i].time) { t0 = pts[i].time; break; } }
            for (let i = pts.length - 1; i >= 0; i--) { if (pts[i].time) { t1 = pts[i].time; break; } }
            if (!t0 || !t1 || isNaN(t0) || isNaN(t1)) return '시간 정보 없음';
            const wd = ['일', '월', '화', '수', '목', '금', '토'];
            const dStr = ms => { const d = new Date(ms); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} (${wd[d.getDay()]})`; };
            const tStr = ms => new Date(ms).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
            if (dStr(t0) === dStr(t1)) return `${dStr(t0)}<br>${tStr(t0)} ~ ${tStr(t1)}`;
            return `${dStr(t0)} ${tStr(t0)} ~<br>${dStr(t1)} ${tStr(t1)}`;
        }

        // 사용자 입력 기록(물/식사/특이사항)은 경로 데이터(userLog)에 함께 저장 -> 백업/복원에도 포함된다
        async function saveRouteUserLog() {
            if (!currentRouteData) return;
            const waterRaw = document.getElementById('log-water').value;
            const waterNum = parseFloat(waterRaw);
            const log = {
                waterL: waterRaw === '' || !isFinite(waterNum) ? null : Math.max(0, waterNum),
                meals: document.getElementById('log-meals').value.trim(),
                notes: document.getElementById('log-notes').value.trim(),
                packKg: Math.max(0, parseFloat(document.getElementById('energy-pack-kg').value) || 0),
                terrain: parseFloat(document.getElementById('energy-terrain').value) || 1.1,
                updatedAt: Date.now()
            };
            try {
                if (!currentRouteData.id) throw new Error('저장된 경로가 아닙니다.');
                await saveRouteUserLogToDB(currentRouteData.id, log);
                currentRouteData.userLog = log;
                document.getElementById('log-saved-at').textContent = `마지막 저장: ${formatLogTime(log.updatedAt)}`;
                showToast('기록이 저장되었습니다.');
            } catch (e) {
                showToast('기록 저장 실패: ' + (e && e.message ? e.message : e));
            }
        }

        function openDetailModal() {
            if (!currentRouteData) return;
            const pts = currentRouteData.points;
            let tt = 0, mt = 0, rt = 0;
            const rests = getRests(pts);
            const restMinList = rests.map(r => Math.round(r.sec / 60)); // 3분 이상 휴식 각각의 시간(분), 시간 순서
            for (const r of rests) rt += r.endMs - r.startMs;
            if (pts.length > 0 && pts[0].time && pts[pts.length-1].time) tt = pts[pts.length-1].time - pts[0].time;
            for (let i=1; i<pts.length; i++) {
                if (pts[i].time && pts[i-1].time) {
                    const dsMs = pts[i].time - pts[i-1].time;
                    if (dsMs > 0 && dsMs < 86400000) mt += dsMs - restOverlapMs(rests, pts[i-1].time, pts[i].time);
                }
            }
            const dKm = currentRouteData.totalDist / 1000;
            const th = tt / 3600000, mh = mt / 3600000;
            const fmt = ms => ms > 0 ? `${Math.floor(ms/3600000)}시간 ${Math.floor((ms%3600000)/60000)}분` : '0분';
            
            // 최고 경사도 계산 로직
            let steep1 = null, steep2 = null;
            if (pts.length > 0) {
                let sortedPts = [...pts].sort((a, b) => Math.abs(b.gradient || 0) - Math.abs(a.gradient || 0));
                if (sortedPts.length > 0) {
                    steep1 = sortedPts[0];
                    for (let i = 1; i < sortedPts.length; i++) {
                        if (Math.abs(sortedPts[i].cumDist - steep1.cumDist) > 300) {
                            steep2 = sortedPts[i];
                            break;
                        }
                    }
                    if (!steep2 && sortedPts.length > 1) steep2 = sortedPts[1];
                }
            }

            const formatGrad = (pt) => {
                if (!pt || !pt.gradient) return '-';
                const sign = pt.gradient > 0 ? '+' : '';
                return `${sign}${pt.gradient.toFixed(1)}%`;
            };
            
            document.getElementById('detail-content').innerHTML = `
                <div class="flex justify-between items-start border-b border-gray-800 pb-2"><span class="text-gray-400">일시</span><span class="text-white text-right leading-snug">${formatTrackPeriod(pts)}</span></div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">거리</span><span class="text-white">${dKm.toFixed(2)} km</span></div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">전체 시간</span><span class="text-white">${fmt(tt)}</span></div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">휴식 제외</span><span class="text-white">${fmt(mt)}</span></div>
                <div class="border-b border-gray-800 pb-2">
                    <div class="flex justify-between"><span class="text-gray-400">휴식 (3분 이상)</span><span class="text-white">${restMinList.length > 0 ? `${restMinList.length}회 · 합계 ${Math.round(rt/60000)}분` : '없음'}</span></div>
                    ${restMinList.length > 0 ? `<div class="text-xs text-indigo-300 mt-1 leading-relaxed break-words">${restMinList.join(', ')} (분)</div>` : ''}
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">평균 (포함)</span><span class="text-white">${th>0?(dKm/th).toFixed(1):0} km/h</span></div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">평균 (제외)</span><span class="text-white">${mh>0?(dKm/mh).toFixed(1):0} km/h</span></div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">상승</span><span class="text-green-400">+${currentRouteData.totalAscent.toFixed(0)} m</span></div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">하강</span><span class="text-red-400">-${currentRouteData.totalDescent.toFixed(0)} m</span></div>
                <div class="flex justify-between border-b border-gray-800 pb-2"><span class="text-gray-400">최고경사 1위</span><span class="text-yellow-400 font-bold">${formatGrad(steep1)}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">최고경사 2위</span><span class="text-yellow-400 font-bold">${formatGrad(steep2)}</span></div>

                <div class="border-t border-gray-700 pt-3 space-y-2">
                    <div class="text-gray-300 font-bold">예상 소모 칼로리</div>
                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div class="bg-gray-800 rounded-lg py-2"><div class="text-[11px] text-gray-400">활동 소모 (이동 중 추가)</div><div id="energy-active" class="text-orange-300 font-bold text-base">-</div></div>
                        <div class="bg-gray-800 rounded-lg py-2"><div class="text-[11px] text-gray-400">전체 소모 (안정시 포함)</div><div id="energy-total" class="text-amber-300 font-bold text-base">-</div></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[11px] text-center">
                        <div class="bg-gray-800/60 rounded-lg py-1.5"><div class="text-gray-400">수평 이동</div><div id="energy-horiz" class="text-white leading-snug">-</div></div>
                        <div class="bg-gray-800/60 rounded-lg py-1.5"><div class="text-gray-400">오르막 상승</div><div id="energy-up" class="text-white leading-snug">-</div></div>
                    </div>
                    <div id="energy-down-note" class="text-[10px] text-gray-500 text-center"></div>
                    <div class="flex items-center space-x-2 text-xs">
                        <span class="text-gray-400">체중</span>
                        <input id="energy-body-kg" type="number" inputmode="decimal" min="0" step="0.5" oninput="updateEnergyDisplay()" class="w-16 bg-gray-800 text-white border border-gray-600 rounded-lg px-2 py-1 text-sm focus:outline-none focus:border-orange-400">
                        <span class="text-gray-400">kg</span>
                        <span class="text-gray-400 ml-2">배낭</span>
                        <input id="energy-pack-kg" type="number" inputmode="decimal" min="0" step="0.5" oninput="updateEnergyDisplay()" class="w-16 bg-gray-800 text-white border border-gray-600 rounded-lg px-2 py-1 text-sm focus:outline-none focus:border-orange-400">
                        <span class="text-gray-400">kg</span>
                    </div>
                    <div class="flex items-center space-x-2 text-xs">
                        <span class="text-gray-400">지형</span>
                        <select id="energy-terrain" onchange="updateEnergyDisplay()" class="flex-1 bg-gray-800 text-white border border-gray-600 rounded-lg px-2 py-1 text-sm focus:outline-none focus:border-orange-400">
                            <option value="1">평탄한 길 (×1.0)</option>
                            <option value="1.1">일반 등산로 (×1.1)</option>
                            <option value="1.2">험한 암릉·너덜 (×1.2)</option>
                        </select>
                    </div>
                    <div class="text-[10px] text-gray-500 leading-snug">ACSM 보행 대사식 기준: 수평 이동 거리와 고도 상승량으로 활동 소모를 계산하고, 지형 계수(Pandolf/Soule-Goldman 지형계수를 참고한 보정)를 곱했습니다. 전체 소모는 활동 소모에 안정시 대사(1 MET = 체중 1kg당 시간당 약 1.05kcal x 체중 x 총 시간)를 더한 값입니다. 상승·하강은 GPS 고도 잡음(앞뒤 15m 평균, ±3m 이내 변화 무시)을 제거한 값이라 위 "상승" 수치와 조금 다를 수 있습니다. 배낭·지형 선택은 '기록 저장' 때 이 경로에 함께 저장됩니다. 오차는 ±20% 안팎의 추정치입니다.</div>
                </div>

                <div class="border-t border-gray-700 pt-3 space-y-2">
                    <div class="text-gray-300 font-bold">나의 기록</div>
                    <label class="block text-xs text-gray-400">물 섭취량 (L)
                        <input id="log-water" type="number" inputmode="decimal" min="0" step="0.1" placeholder="예: 1.5" class="mt-1 w-full bg-gray-800 text-white border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
                    </label>
                    <label class="block text-xs text-gray-400">식사 내역
                        <textarea id="log-meals" rows="3" placeholder="예: 점심 김밥 2줄, 간식 에너지바, 커피 1잔" class="mt-1 w-full bg-gray-800 text-white border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400"></textarea>
                    </label>
                    <label class="block text-xs text-gray-400">특이사항
                        <textarea id="log-notes" rows="3" placeholder="예: 날씨, 컨디션, 위험 구간, 다음에 챙길 것" class="mt-1 w-full bg-gray-800 text-white border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400"></textarea>
                    </label>
                    <button onclick="saveRouteUserLog()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-sm font-bold active:scale-95 transition">기록 저장</button>
                    <div id="log-saved-at" class="text-[10px] text-gray-500 text-right"></div>
                </div>
            `;

            // 입력칸 초기값 (사용자 텍스트는 innerHTML이 아닌 value로 넣어 안전하게 처리)
            let savedBody = 70;
            try { const v = parseFloat(localStorage.getItem(BODY_KG_KEY)); if (v > 0) savedBody = v; } catch (e) {}
            const ul = currentRouteData.userLog || {};
            energyCache = computeEnergyProfile(pts, (mt + rt) / 3600000);
            document.getElementById('energy-terrain').value = String(ul.terrain || 1.1);
            document.getElementById('energy-body-kg').value = savedBody;
            document.getElementById('energy-pack-kg').value = ul.packKg || 0;
            document.getElementById('log-water').value = (ul.waterL === null || ul.waterL === undefined) ? '' : ul.waterL;
            document.getElementById('log-meals').value = ul.meals || '';
            document.getElementById('log-notes').value = ul.notes || '';
            document.getElementById('log-saved-at').textContent = ul.updatedAt ? `마지막 저장: ${formatLogTime(ul.updatedAt)}` : '';
            updateEnergyDisplay();
            document.getElementById('detail-modal').classList.remove('hidden');
        }
        function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

        function openWaypointModal() {
            if (!scrubberMarker) { showToast("하단 그래프를 움직여 지도 위 위치를 선택해주세요."); return; }
            
            document.getElementById('waypoint-name-input').value = '';
            document.getElementById('waypoint-modal').classList.remove('hidden');
            document.getElementById('waypoint-name-input').focus();
        }

        function closeWaypointModal() { 
            document.getElementById('waypoint-modal').classList.add('hidden'); 
        }

        async function confirmAddWaypoint() {
            const name = document.getElementById('waypoint-name-input').value.trim();
            if (!name) { showToast("이름을 입력해주세요."); return; }
            
            const latlng = scrubberMarker.getLatLng();
            
            const existingWaypoints = await getAllWaypointsFromDB();
            if (existingWaypoints && existingWaypoints.length > 0) {
                for (let wp of existingWaypoints) {
                    const dist = getDistance(latlng.lat, latlng.lng, wp.lat, wp.lon);
                    if (dist <= 30) {
                        showToast(`너무 가깝습니다! 30m 이내에 '${wp.name}' 포인트가 이미 있습니다.`);
                        return;
                    }
                }
            }

            const newWp = { lat: latlng.lat, lon: latlng.lng, name: name };
            
            try {
                newWp.id = await saveWaypointToDB(newWp);
                renderWaypoint(newWp);
                showToast(`'${name}' 웨이포인트 추가 완료!`);
                closeWaypointModal();
            } catch (e) {
                showToast("저장 실패: " + e.message);
            }
        }

        function renderWaypoint(wp) {
            const iconHtml = `
                <div class="relative flex flex-col items-center pointer-events-none">
                    <div class="wp-label-text pointer-events-auto cursor-pointer bg-pink-600/90 backdrop-blur-sm text-white text-[11px] font-bold px-2 py-0.5 rounded shadow-lg border border-pink-400 whitespace-nowrap absolute bottom-4 transition-all duration-300">
                        ${wp.name}
                    </div>
                    <div class="w-3 h-3 bg-pink-500 rounded-full border-2 border-white shadow-md absolute -bottom-1.5 -left-1.5"></div>
                </div>
            `;
            const wpIcon = L.divIcon({
                className: 'bg-transparent border-none',
                html: iconHtml,
                iconSize: [0, 0],
                iconAnchor: [0, 0]
            });
            const marker = L.marker([wp.lat, wp.lon], { icon: wpIcon, zIndexOffset: 600, keyboard: false });
            marker.on('click', () => openWaypointDeletePopup(wp, marker));
            marker.addTo(waypointLayerGroup);
        }

        // 웨이포인트 말풍선을 누르면 삭제 확인 말풍선을 띄운다
        function openWaypointDeletePopup(wp, marker) {
            const box = document.createElement('div');
            box.className = 'text-center';

            const title = document.createElement('div');
            title.className = 'font-bold text-pink-300 text-[13px] break-all';
            title.textContent = wp.name;

            const msg = document.createElement('div');
            msg.className = 'text-[11px] text-gray-300 mt-0.5';
            msg.textContent = '이 웨이포인트를 삭제할까요?';

            const row = document.createElement('div');
            row.className = 'flex space-x-2 mt-2';

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'flex-1 bg-gray-700 hover:bg-gray-600 text-white text-xs font-medium px-3 py-1.5 rounded-lg active:scale-95 transition';
            cancelBtn.textContent = '취소';
            cancelBtn.addEventListener('click', () => map.closePopup());

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'flex-1 bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95 transition';
            delBtn.textContent = '삭제';
            delBtn.addEventListener('click', async () => {
                try {
                    await deleteWaypointFromDB(wp.id);
                    waypointLayerGroup.removeLayer(marker);
                    map.closePopup();
                    showToast(`'${wp.name}' 웨이포인트를 삭제했습니다.`);
                } catch (e) {
                    showToast('삭제 실패: ' + (e && e.message ? e.message : e));
                }
            });

            row.append(cancelBtn, delBtn);
            box.append(title, msg, row);

            L.popup({ autoPan: false, closeButton: false, className: 'route-popup', offset: [0, -34], maxWidth: 240 })
                .setLatLng(marker.getLatLng())
                .setContent(box)
                .openOn(map);
        }

        if (isLoggedIn()) { startApp(); } else { showLoginModal(); }

    </script>
</body>
</html>
